name: CI
# Build, tests and security scanning only — this workflow never deploys (DEP-13, SEC-12).
# Deployment must go through a separately approved, environment-protected job (see Phase 0 isolation plan).

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests run against a real local Cloudflare D1 + R2 (Wrangler's local runtime, no Cloudflare account or network).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Backend — typecheck, tests (incl. security regression + RBAC matrix) and coverage
        working-directory: backend
        run: npm ci && npx tsc --noEmit && npx vitest run --coverage --coverage.include='src/lib/**' --coverage.include='src/services/**' --coverage.reporter=text-summary
      - name: Frontend — typecheck & build
        working-directory: frontend
        run: npm ci && npx tsc -b && npx vite build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: npm audit (production dependencies, fail on high/critical)
        run: |
          (cd backend && npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high)
          (cd frontend && npm ci --ignore-scripts && npm audit --omit=dev --audit-level=high)

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
