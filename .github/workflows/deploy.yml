name: CI
# Deployment is done by Cloudflare Workers Builds (connected to this repo) on every push to main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: nexora, POSTGRES_PASSWORD: nexora, POSTGRES_DB: nexora_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nexora:nexora@localhost:5432/nexora_test?schema=public
      TEST_DATABASE_URL: postgresql://nexora:nexora@localhost:5432/nexora_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Backend — typecheck & tests
        working-directory: backend
        run: npm ci && npx prisma generate && npx tsc --noEmit && npm test
      - name: Frontend — typecheck & build
        working-directory: frontend
        run: npm ci && npx tsc -b && npx vite build
