# Backend (API + PostgreSQL) for the Cloudflare deployment.
# The API is published through a Cloudflare Tunnel, so no inbound ports are opened on the server.
#
#   cp deploy/.env.cloudflare.example deploy/.env    # fill in secrets
#   docker compose -f deploy/docker-compose.cloudflare.yml --env-file deploy/.env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nexora
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nexora"], interval: 5s, retries: 10 }

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD}@db:5432/nexora?schema=public
      UPLOAD_DIR: /app/uploads
    volumes: [uploads:/app/uploads]
    depends_on: { db: { condition: service_healthy } }

  # Cloudflare Tunnel: Zero Trust → Networks → Tunnels → Create → Docker → copy the token.
  # Public hostname: api.nexoraedu.com → Service http://api:4000
  cloudflared:
    image: cloudflare/cloudflared:2025.1.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [api]

  # Nightly logical backup into the "backups" volume (rotate/offload per your retention policy).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [backups:/backups]
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U nexora -Fc nexora > /backups/nexora-$$(date +%u).dump; sleep 86400; done"]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
  uploads:
  backups:
