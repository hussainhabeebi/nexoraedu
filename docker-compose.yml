# Nexora Academy portal — production-like stack.
#   cp backend/.env.example .env   (then edit secrets & Chatwoot values)
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nexora
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nexora"], interval: 5s, retries: 10 }

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/nexora?schema=public
      UPLOAD_DIR: /app/uploads
    volumes: [uploads:/app/uploads]
    depends_on: { db: { condition: service_healthy } }

  web:
    build: ./frontend
    restart: unless-stopped
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]

volumes:
  pgdata:
  uploads:
